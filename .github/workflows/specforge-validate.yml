name: Agentsembli SpecForge validation
on: [push, pull_request]
jobs:
  script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Compatibility tests exercise the previous release tag.
          fetch-depth: 0
      - run: scripts/test
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node bin/cli.js --help
      - run: scripts/cli.test.sh
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx openspec validate --all
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: scripts/acceptance.sh --mechanical
  invariants:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch base ref
        run: git fetch --no-tags --prune origin "$GITHUB_BASE_REF"
      - name: Branch name satisfies the convention
        run: scripts/check-branch-name "$GITHUB_HEAD_REF"
      - name: Every introduced commit satisfies the commit-message rule
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          status=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            git show -s --format=%B "$sha" > "$tmp"
            if ! scripts/hooks/commit-msg "$tmp"; then
              echo "::error::commit $sha violates the commit-message rule: $(git show -s --format=%s "$sha")"
              status=1
              break
            fi
          done < <(git rev-list --no-merges "origin/${GITHUB_BASE_REF}..HEAD")
          exit "$status"
