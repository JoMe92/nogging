name: Nogging validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
        python: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci
      - run: bash scripts/cli.test.sh
      - run: bash scripts/nogg.test.sh
  script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Compatibility tests exercise the previous release tag.
          fetch-depth: 0
      - run: scripts/test
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node bin/cli.js --help
      - run: scripts/cli.test.sh
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx openspec validate --all
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: scripts/acceptance.sh --mechanical
  invariants:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Fetch base ref
        run: git fetch --no-tags --prune origin "$GITHUB_BASE_REF"
      - name: Branch name satisfies the convention
        run: scripts/check-branch-name "$GITHUB_HEAD_REF"
      - name: Every introduced commit satisfies the commit-message rule
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          status=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            git show -s --format=%B "$sha" > "$tmp"
            if ! scripts/hooks/commit-msg "$tmp"; then
              echo "::error::commit $sha violates the commit-message rule: $(git show -s --format=%s "$sha")"
              status=1
              break
            fi
          done < <(git rev-list --no-merges "origin/${GITHUB_BASE_REF}..HEAD")
          exit "$status"

  public-release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - name: Credential pattern scan
        run: scripts/ci-security-gates.sh secrets
      - name: Markdown relative-link validation
        run: scripts/ci-security-gates.sh links
      - name: Clean package-content validation
        run: scripts/ci-security-gates.sh package
      - name: Dependency vulnerability scan
        run: scripts/ci-security-gates.sh dependencies

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # continue-on-error: the action needs the repo's Dependency graph
      # (Settings -> Security -> Dependency graph) enabled, which is a
      # private-repository owner action, not something this workflow can
      # turn on. `scripts/ci-security-gates.sh dependencies` above (npm
      # audit) is the enforced, always-available dependency gate; this job
      # becomes real additional PR-diff coverage the moment the owner
      # enables the graph, without blocking every PR until then.
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        continue-on-error: true
