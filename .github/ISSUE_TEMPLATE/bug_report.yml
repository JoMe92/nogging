name: Bug report
description: Report reproducible incorrect Nogging behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here; follow SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence of commands or repository state that reproduces the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nogging version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, and relevant Git, Node, Python, OpenSpec, Beads, Dolt, tmux, and agent versions.
