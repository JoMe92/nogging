# SpecForge Pi launch spec — the `restricted` authority level for a
# `session launch --agent pi` session.
#
# Unlike Claude and Codex, Pi has no native sandbox and no first-party
# permissions/approval model this bridge can drive. The command floor for
# Pi comes entirely from the always-on guard extension
# (`.pi/extensions/nogging-guard.ts`, ships with this same change,
# TASK-PIA-004): it enforces the SpecForge command floor and the
# `openspec/` write boundary by reading `.nogging/locks/openspec.readonly`
# directly at tool-call time. That guard is active at BOTH the `restricted`
# and `trusted` levels — `session_launch()` never constructs a flag that
# would disable or bypass it.
#
# Honesty note (matches the spec): this is a strictly weaker guarantee than
# the `claude` and `codex` `restricted` level. There is NO network sandbox
# and NO filesystem sandbox under either Pi authority level — only the
# command floor and the openspec/ write boundary are enforced. Do not treat
# `restricted` here as equivalent to `restricted` for `claude` or `codex`.
#
# Keys (both optional; `session_launch()` reads only these two, and neither
# is required — an empty/all-comment file is valid):
#   provider   quoted string -> pi --provider <name>
#   model      quoted string -> pi --model <pattern>
#
# provider = "anthropic"
# model    = "claude-..."
