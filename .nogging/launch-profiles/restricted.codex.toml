# Nogging Codex launch spec — the `restricted` authority level for a
# `session launch --agent codex` session. It is the Codex-side sibling of
# restricted.json: same intent (require approval for non-trivial actions,
# no outbound network), expressed in Codex's sandbox / approval model.
#
# Network split: this level keeps `network_access = false`, so `git push`,
# `bd sync`, and `dolt push|pull` all fail with no network — the
# restricted-profile remote boundary. Only the `trusted` level
# (`trusted.codex.toml`) sets `network_access = true`.
#
# Required keys (`session_launch()` refuses a spec without them):
#   sandbox           one of read-only | workspace-write | danger-full-access
#                     -> codex --sandbox <mode>
#   ask_for_approval  one of untrusted | on-request | never
#                     -> codex --ask-for-approval <policy>
#   network_access    bool; true  -> codex -c 'sandbox_workspace_write.network_access=true'
#                           false -> codex -c 'sandbox_workspace_write.network_access=false'
#
# Optional keys (omit them to keep Codex's own defaults):
#   model                   quoted model name; `session launch --model` overrides it
#   model_reasoning_effort  one of none | minimal | low | medium | high | xhigh | max | ultra
sandbox          = "workspace-write"
ask_for_approval = "on-request"
network_access   = false
