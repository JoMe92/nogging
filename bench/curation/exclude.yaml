# The exclusion list of the benchmark's curation (design Decision 18, TASK-BEN-006).
#
# A repository named here is among the most-used training and evaluation sources
# and never becomes a candidate. `nogg-bench candidates repos` skips it and
# records the skip. The preregistration's selection block names this file.
#
# Each list holds the distinct values of the `repo` column of one public dataset,
# read on the `retrieved` date from the dataset at `source` through the Hugging
# Face dataset viewer (https://datasets-server.huggingface.co/statistics). The
# names are spelled as the dataset spells them. Where GitHub has renamed a
# repository since, its current full name follows on the next line with a
# comment; those were read on the same date from the GitHub API
# (https://api.github.com/repos/<name as the dataset spells it>), which answers
# with the current name. Compare names without regard to case.
#
# Like the preregistration, this file is not edited after the first measured run.
schema: 1
