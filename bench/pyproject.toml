[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nogg-bench"
version = "0.1.0"
description = "Impact benchmark for Nogging: validated tasks, arms, result lines, reviews and thresholds."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Pinned by BEN-003 once the installed Harbor's agent interface is checked.
harbor = []

[project.scripts]
nogg-bench = "nogg_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
