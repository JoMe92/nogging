<div class="nogging-footer">
  <p class="nogging-footer-license">Nogging is released under the ISC License.</p>
  <nav class="nogging-footer-links" aria-label="Project">
    <ul>
      <li><a href="https://github.com/JoMe92/nogging">GitHub</a></li>
      <li><a href="https://github.com/JoMe92/nogging/blob/develop/SECURITY.md">Security policy</a></li>

    </ul>
