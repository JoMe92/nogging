title: Nogging
description: >-
  Structure for a team of agents: role boundaries, planning and Git-evidenced
  execution for Claude Code, Codex, Pi and Antigravity, built on OpenSpec and
  Beads.
url: https://jome92.github.io
baseurl: /nogging
permalink: pretty
remote_theme: just-the-docs/just-the-docs@v0.12.0

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings

relative_links:
  enabled: true
  collections: false

optional_front_matter:
  remove_originals: true

titles_from_headings:
  enabled: true
  strip_title: false
  collections: false

search_enabled: true
color_scheme: nogging

exclude:
  - README.md
  - acceptance/
  - acceptance-report-template.md
  - public-cutover.md

aux_links:
  GitHub repository: https://github.com/JoMe92/nogging
  Releases: https://github.com/JoMe92/nogging/releases
  Discussions: https://github.com/JoMe92/nogging/discussions
aux_links_new_tab: true

nav_external_links:
  - title: Contributing
    url: https://github.com/JoMe92/nogging/blob/develop/CONTRIBUTING.md
  - title: Code of Conduct
    url: https://github.com/JoMe92/nogging/blob/develop/CODE_OF_CONDUCT.md
  - title: Security policy
    url: https://github.com/JoMe92/nogging/blob/develop/SECURITY.md
  - title: Changelog
    url: https://github.com/JoMe92/nogging/blob/develop/CHANGELOG.md
  - title: Releases
    url: https://github.com/JoMe92/nogging/releases

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /brand/nogging-social-card.png
  - scope:
      path: "index.md"
    values:
      layout: home
      nav_exclude: true
      description: Nogging documentation for planning, working, and shipping with agents.
  - scope:
      path: "404.md"
    values:
      nav_exclude: true
      permalink: /404.html
      description: Find the Nogging documentation page you need.
  - scope:
      path: "getting-started.md"
    values:
      title: Getting started
      has_children: true
      nav_order: 1
      description: Install Nogging, check compatibility, and make your first change.
  - scope:
      path: "installation.md"
    values:
      parent: Getting started
      nav_order: 1
      description: Install Nogging into another repository and understand what it changes.
  - scope:
      path: "compatibility.md"
    values:
      parent: Getting started
      nav_order: 2
      description: Supported operating systems, tools, versions, and agent integrations.
  - scope:
      path: "first-change.md"
