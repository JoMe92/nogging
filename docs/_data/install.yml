# Single install source for the landing page and the footer (docs/index.md,
# docs/_includes/footer_custom.html). README.md and docs/installation.md keep
# literal copies; scripts/docs-site.test.sh checks all three are byte-identical
# and scripts/release-pins.test.sh checks the tag. Bump it with the release
# pins (docs/releasing.md step 4).
tag: v3.2.0
bootstrap: curl -fsSL https://raw.githubusercontent.com/JoMe92/nogging/v3.2.0/scripts/bootstrap | bash
init: npx github:JoMe92/nogging#v3.2.0 init --no-systemd
